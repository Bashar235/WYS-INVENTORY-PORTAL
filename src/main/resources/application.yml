spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory_portal
    username: postgres
    password: "your_password"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-check-sum-on-save: true

server:
  port: 8080

zk:
  homepage: zul/index

logging:
  level:
    org.springframework.security: DEBUG
    com.wys.inventory: DEBUG
    org.flywaydb: INFO
